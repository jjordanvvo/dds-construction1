# DD's Construction — Netlify configuration

[build]
  publish = "."

# Redirect HTTP → HTTPS
[[redirects]]
  from = "http://ddsconstructionca.com/*"
  to   = "https://ddsconstructionca.com/:splat"
  status = 301
  force  = true

# WWW → apex redirect
[[redirects]]
  from = "https://www.ddsconstructionca.com/*"
  to   = "https://ddsconstructionca.com/:splat"
  status = 301
  force  = true

# SPA fallback (keeps clean URLs working on refresh)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — short cache so updates deploy instantly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
